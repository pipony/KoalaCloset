<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小迪的衣橱 · The Wardrobe Edit</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap" style="max-width:1180px;margin:0 auto">

  <header class="masthead">
    <div class="kicker">
      <span>Vol. 01 — 衣橱档案</span>
      <span>Local &amp; Private</span>
    </div>
    <h1 id="brand" title="回首页" style="cursor:pointer">Koala Closet <em>The Wardrobe Edit</em></h1>
    <div class="sub">
      <span>一百件衣服的私人刊物 · 只关于穿衣这件事</span>
      <span>
        <a class="btn sm" href="#/board" id="board-entry">搭配板<span class="badge" id="board-badge" style="display:none">0</span></a>
        <a class="btn sm" href="#/compare" id="compare-entry">＋ 买前比对</a>
        <a class="btn sm primary" href="#/editor/new">+ 录入新衣</a>
      </span>
    </div>
  </header>

  <div class="searchbar" id="searchbar">
    <span class="no">№ 001</span>
    <input id="search-input" placeholder="用一句话找衣服：明天 16°C 通勤、想穿得利落一点" autocomplete="off">
    <span class="hint">SEARCH</span>
  </div>

  <nav class="toc" id="toc">
    <a href="#/wardrobe" data-route="wardrobe">衣柜</a>
    <a href="#/outfits" data-route="outfits">套搭</a>
    <a href="#/sizes" data-route="sizes">尺码档案</a>
    <a href="#/annotate" data-route="annotate">AI 标注</a>
    <a href="#/avoid" data-route="avoid">避雷清单</a>
  </nav>

  <main id="view"></main>

  <footer>小 迪 的 衣 橱 · 全 本 地 · 断 网 可 用</footer>
</div>
